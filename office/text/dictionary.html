<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesadores de Texto</title>
    <link rel="stylesheet" href="../css/dictionary.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📚 Guía de Procedimientos para Procesadores de Texto</h1>
            <!-- <p>Encuentra rápidamente cómo realizar tareas en diferentes programas</p>-->
        </header>

        <!-- Search Bar + Download PDF button -->
        <div class="search-container">
            <button id="clear-search-btn" class="clear-btn" title="Borrar búsqueda">✕</button>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar procedimiento..."
                autocomplete="off">
            <button id="export-pdf-btn" class="export-btn">⬇ Exportar PDF</button>
        </div>

        <!-- Program Filters -->
        <div class="filters-container">
            <h2>Filtrar por programa:</h2>
            <div id="program-filters">
                <!-- Los filtros se generan dinámicamente -->
            </div>
        </div>

        <!-- Procedures Container -->
        <div id="procedures-container">
            <!-- Los procedimientos se cargan dinámicamente -->
        </div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="image-modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img id="modal-image" class="modal-image" src="" alt="Vista ampliada">
        </div>
    </div>

    <iframe 
        id="tinyfoot-iframe"
        src="../../layout/tinyfoot.html" 
        scrolling="no"
        style="position: fixed; bottom: 10px; right: -600px; width: 300px; height: 80px; border: none; z-index: 9999; overflow: hidden; transition: right 0.5s ease-in-out;">
    </iframe>

    <script src="../js/loader.js"></script>
    <script src="../../js/iframeanimation.js"></script> <!-- Animación del iframe del foot -->
</body>

</html>
