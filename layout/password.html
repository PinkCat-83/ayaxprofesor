<!-- MODAL Curso Actual -->
<div id="curso-overlay" onclick="cerrarSiOverlay(event)">
  <div id="curso-modal">
    <button id="curso-close" onclick="cerrarCurso()" title="Cerrar">✕</button>

    <!-- Vista: formulario de clave -->
    <div id="curso-form">
      <h2>📚 Curso Actual</h2>
      <p>Introduce la clave que te ha dado tu profe</p>
      <input
        type="password"
        id="curso-password"
        placeholder="••••••"
        autocomplete="off"
        maxlength="20"
        onkeydown="if(event.key==='Enter') verificarClave()"
      >
      <div id="curso-error"></div>
      <button id="curso-submit" onclick="verificarClave()">Acceder →</button>
    </div>

    <!-- Vista: cuenta atrás de redirección -->
    <div id="curso-redirect">
      <div class="redirect-title">✅ ¡Clave correcta!</div>
      <div class="redirect-count" id="curso-count">5</div>
      <div class="redirect-sub">Redirigiendo al material...</div>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
      <button class="btn-now" onclick="irAhora()">Ir ahora</button>
    </div>
  </div>
</div>
