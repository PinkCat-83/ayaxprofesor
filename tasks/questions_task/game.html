<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gato Saltarín</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- ═══════════════════════════════════════════
   PANTALLA: MENÚ PRINCIPAL
═══════════════════════════════════════════ -->
  <div id="screen-menu" class="screen active">
    <div class="menu-bg"></div>
    <div class="menu-content">
      <div class="title-block">
        <h1 id="page-title">Gato Saltarín</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div class="difficulty-selector">
        <img class="menu-cat" src="img/pinkcat_idle.png" alt="Gato Rosa" />
        <p class="choose-label">Elige tu nivel:</p>
        <div id="levels-container"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
   PANTALLA: JUEGO
═══════════════════════════════════════════ -->
  <div id="screen-game" class="screen">

    <div id="hud">
      <div id="hud-progress"></div>
      <div id="hud-controls">
        <span class="volume-icon">🔊</span>
        <input type="range" id="volume-slider" min="0" max="100" value="80" title="Volumen" />
        <button id="btn-menu-hud">Menú</button>
      </div>
    </div>

    <div id="game-stage">
      <div id="svg-wrapper">
        <div id="hud-lives"></div>
        <div id="peripheral-display">
          <span id="peripheral-label">Cargando…</span>
        </div>
        <svg id="stage-svg" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet" style="overflow:hidden">

        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fdf4ff" />
            <stop offset="100%" stop-color="#fce7f3" />
          </linearGradient>
          <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7dd3fc" />
            <stop offset="100%" stop-color="#0369a1" />
          </linearGradient>
          <filter id="bgBlur" x="0" y="0" width="100%" height="100%">
            <feGaussianBlur stdDeviation="3" />
          </filter>
        </defs>

        <!-- Cielo celeste -->
        <rect width="800" height="320" fill="#7ec8e3" />

        <!-- Nubes (detrás del fondo) -->
        <g class="cloud" opacity="0.7">
          <ellipse cx="120" cy="55" rx="45" ry="22" fill="white" />
          <ellipse cx="150" cy="45" rx="35" ry="20" fill="white" />
          <ellipse cx="90" cy="60" rx="30" ry="18" fill="white" />
        </g>
        <g class="cloud cloud2" opacity="0.6">
          <ellipse cx="620" cy="40" rx="50" ry="20" fill="white" />
          <ellipse cx="655" cy="30" rx="38" ry="18" fill="white" />
          <ellipse cx="590" cy="45" rx="32" ry="16" fill="white" />
        </g>

        <!-- Fondo imagen (fijo, ligeramente difuminado) -->
        <image href="img/background.webp" x="0" y="0" width="800" height="320" preserveAspectRatio="xMidYMid slice"
          filter="url(#bgBlur)" />

        <!-- Agua -->
        <rect x="0" y="210" width="800" height="110" fill="url(#waterGrad)" opacity="0.9" />
        <path id="wave1"
          d="M0,220 Q100,207 200,220 Q300,233 400,220 Q500,207 600,220 Q700,233 800,220 L800,320 L0,320 Z"
          fill="#bae6fd" opacity="0.5" />
        <path id="wave2"
          d="M0,228 Q100,215 200,228 Q300,241 400,228 Q500,215 600,228 Q700,241 800,228 L800,320 L0,320 Z"
          fill="#7dd3fc" opacity="0.4" />

        <!-- ══ GRUPO MUNDO ══ -->
        <g id="world-group">

          <!-- Plataforma izquierda -->
          <g id="plat-left" transform="translate(0,0)">
            <!-- ola trasera -->
            <path class="plat-wave plat-wave-b" d="M-20,228 Q15,220 50,228 Q85,236 110,228" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/platform_ground.png" x="-20" y="195" width="130" height="55" />
            <!-- ola delantera azul -->
            <path class="plat-wave plat-wave-a" d="M-20,231 Q15,223 50,231 Q85,239 110,231" fill="none" stroke="#7dd3fc"
              stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <!-- espuma blanca -->
            <path class="plat-wave plat-wave-a" d="M-20,231 Q15,223 50,231 Q85,239 110,231" fill="none" stroke="white"
              stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.85" />
          </g>

          <!-- Rocas con olas en y=-16 (30% más arriba que antes, que era y=-2)
               Cada grupo tiene:
                 1. ola trasera azul (rock-wave-b) — detrás de la roca
                 2. imagen de la roca
                 3. ola delantera azul (rock-wave-a) + espuma blanca — delante de la roca -->
          <g id="rock0" class="rock-group" transform="translate(205,240)">
            <!-- ola trasera -->
            <path class="rock-wave rock-wave-b"
              d="M-54,-19 Q-40,-26 -27,-19 Q-13,-12 0,-19 Q13,-26 27,-19 Q40,-12 54,-19" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/rock.png" x="-41" y="-48" width="82" height="48" class="rock-img" />
            <!-- ola delantera azul -->
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <!-- espuma blanca sobre la cresta de la ola delantera -->
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"
              opacity="0.85" />
            <text class="rock-label" x="0" y="-10" text-anchor="middle"></text>
          </g>

          <g id="rock1" class="rock-group" transform="translate(375,240)">
            <path class="rock-wave rock-wave-b"
              d="M-54,-19 Q-40,-26 -27,-19 Q-13,-12 0,-19 Q13,-26 27,-19 Q40,-12 54,-19" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/rock.png" x="-41" y="-48" width="82" height="48" class="rock-img" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"
              opacity="0.85" />
            <text class="rock-label" x="0" y="-10" text-anchor="middle"></text>
          </g>

          <g id="rock2" class="rock-group" transform="translate(545,240)">
            <path class="rock-wave rock-wave-b"
              d="M-54,-19 Q-40,-26 -27,-19 Q-13,-12 0,-19 Q13,-26 27,-19 Q40,-12 54,-19" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/rock.png" x="-41" y="-48" width="82" height="48" class="rock-img" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"
              opacity="0.85" />
            <text class="rock-label" x="0" y="-10" text-anchor="middle"></text>
          </g>

          <!-- Set B de rocas (precargado fuera de pantalla, se posiciona antes del scroll) -->
          <g id="rock3" class="rock-group" transform="translate(-9999,240)">
            <path class="rock-wave rock-wave-b"
              d="M-54,-19 Q-40,-26 -27,-19 Q-13,-12 0,-19 Q13,-26 27,-19 Q40,-12 54,-19" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/rock.png" x="-41" y="-48" width="82" height="48" class="rock-img" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"
              opacity="0.85" />
            <text class="rock-label" x="0" y="-10" text-anchor="middle"></text>
          </g>

          <g id="rock4" class="rock-group" transform="translate(-9999,240)">
            <path class="rock-wave rock-wave-b"
              d="M-54,-19 Q-40,-26 -27,-19 Q-13,-12 0,-19 Q13,-26 27,-19 Q40,-12 54,-19" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/rock.png" x="-41" y="-48" width="82" height="48" class="rock-img" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"
              opacity="0.85" />
            <text class="rock-label" x="0" y="-10" text-anchor="middle"></text>
          </g>

          <g id="rock5" class="rock-group" transform="translate(-9999,240)">
            <path class="rock-wave rock-wave-b"
              d="M-54,-19 Q-40,-26 -27,-19 Q-13,-12 0,-19 Q13,-26 27,-19 Q40,-12 54,-19" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/rock.png" x="-41" y="-48" width="82" height="48" class="rock-img" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <path class="rock-wave rock-wave-a" d="M-50,-16 Q-36,-24 -22,-16 Q-8,-8 6,-16 Q20,-24 34,-16 Q44,-10 50,-16"
              fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"
              opacity="0.85" />
            <text class="rock-label" x="0" y="-10" text-anchor="middle"></text>
          </g>

          <!-- Plataforma derecha -->
          <g id="plat-right" transform="translate(660,0)">
            <!-- ola trasera -->
            <path class="plat-wave plat-wave-b" d="M-20,228 Q15,220 50,228 Q85,236 110,228" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linecap="round" opacity="0.75" />
            <image href="img/platform_ground.png" x="-20" y="195" width="130" height="55" />
            <!-- ola delantera azul -->
            <path class="plat-wave plat-wave-a" d="M-20,231 Q15,223 50,231 Q85,239 110,231" fill="none" stroke="#7dd3fc"
              stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
            <!-- espuma blanca -->
            <path class="plat-wave plat-wave-a" d="M-20,231 Q15,223 50,231 Q85,239 110,231" fill="none" stroke="white"
              stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.85" />
          </g>

          <!-- Capa de polvo (generada dinámicamente por JS) -->
          <g id="dust-layer"></g>

        </g>
        <!-- FIN GRUPO MUNDO -->

        <!-- GATO -->
        <g id="cat" transform="translate(-3,126)">
          <g id="cat-mirror">
          <g id="cat-rot">
              <image id="cat-img-idle"    href="img/pinkcat_idle.png"    x="0" y="0" width="96" height="84" />
              <image id="cat-img-sjump"   href="img/pinkcat_sjump.png"   x="0" y="0" width="96" height="84" style="display:none" />
              <image id="cat-img-fanfare" href="img/pinkcat_fanfare.png" x="0" y="0" width="96" height="84" style="display:none" />
              <image id="cat-img-water"   href="img/pinkcat_water.png"   x="0" y="0" width="96" height="84" style="display:none" />
            </g>
          </g>
        </g>

        <!-- Capa de agua frontal -->
        <rect x="0" y="232" width="800" height="88" fill="url(#waterGrad)" opacity="0.35" />
        <path d="M0,232 Q100,224 200,232 Q300,240 400,232 Q500,224 600,232 Q700,240 800,232 L800,320 L0,320 Z"
          fill="#7dd3fc" opacity="0.25" />

      </svg>

        <!-- Imagen opcional de la pregunta: visible solo si la pregunta tiene "img" -->
        <div id="question-img-panel" aria-hidden="true">
          <img id="question-img-a" src="" alt="" />
          <img id="question-img-b" src="" alt="" />
        </div>

      </div> <!-- /svg-wrapper -->

    </div>

    <div id="feedback-msg"></div>

  </div>

  <!-- ═══════════════════════════════════════════
   PANTALLA: VICTORIA
═══════════════════════════════════════════ -->
  <div id="screen-victory" class="screen">
    <div class="end-content">
      <div class="end-emoji">🎉</div>
      <h2>¡Felicidades!</h2>
      <p id="victory-text">Has completado todos los periféricos.</p>
      <button class="btn-end" id="btn-play-again">Jugar de nuevo</button>
      <button class="btn-end secondary" id="btn-menu-victory">Menú principal</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
   PANTALLA: GAME OVER
═══════════════════════════════════════════ -->
  <div id="screen-gameover" class="screen">
    <div class="end-content">
      <div class="end-emoji splashed">💧</div>
      <h2>¡Gato sobremojado!</h2>
      <p id="gameover-text">El gato se ha caído. ¡Inténtalo de nuevo!</p>
      <button class="btn-end" id="btn-retry">Reintentar</button>
      <button class="btn-end secondary" id="btn-menu-gameover">Menú principal</button>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="snd-jump" src="audio/jump.mp3" preload="auto"></audio>
  <audio id="snd-splash" src="audio/splash.mp3" preload="auto"></audio>
  <audio id="snd-gameover" src="audio/gameover.mp3" preload="auto"></audio>
  <audio id="snd-fanfare" src="audio/fanfare.mp3" preload="auto" loop></audio>

  <!-- GIF fuegos artificiales (victoria) -->
  <div id="fireworks-gif" aria-hidden="true">
    <img src="img/fireworks.gif" alt="" />
  </div>

  <script type="module" src="js/main.js"></script>

  <iframe id="tinyfoot-iframe" src="/layout/tinyfoot.html" scrolling="no"
    style="position: fixed; bottom: 10px; right: -600px; width: 300px; height: 80px; border: none; z-index: 9999; overflow: hidden; transition: right 0.5s ease-in-out;">
  </iframe>
  <script src="/js/iframeanimation.js"></script> <!-- Animación del iframe del foot -->

</body>

</html>
